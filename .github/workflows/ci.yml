name: Check minilearn
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
  rust-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: node scripts/prepare-tauri-assets.mjs
      - run: cargo test --manifest-path src-tauri/Cargo.toml
  release:
    name: Publish minilearn release
    needs: [test, rust-test]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: macos-latest
    permissions:
      contents: write
    concurrency:
      group: minilearn-release-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check if this commit is still main HEAD
        id: head_check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          head=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')
          if [[ "$head" != "$GITHUB_SHA" ]]; then
            echo "A newer commit is on main; skipping this older build."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.head_check.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        if: steps.head_check.outputs.skip != 'true'
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        if: steps.head_check.outputs.skip != 'true'
        with:
          workspaces: src-tauri
      - uses: taiki-e/install-action@v2
        if: steps.head_check.outputs.skip != 'true'
        with:
          tool: cargo-binstall
      - name: Install Tauri CLI
        if: steps.head_check.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: cargo binstall "tauri-cli@^2" --no-confirm --locked
      - name: Install JS dependencies
        if: steps.head_check.outputs.skip != 'true'
        run: npm ci
      # Only the .app is bundled here. Hosted macOS runners intermittently fail
      # Tauri's bundle_dmg.sh with `hdiutil: create failed - Resource busy`
      # (Spotlight and XProtectBehaviourService still holding the new image), and
      # the vendored create-dmg never retries that case. The disk images are
      # created below instead, with their own retries.
      - name: Build Apple Silicon macOS bundle
        if: steps.head_check.outputs.skip != 'true'
        env:
          CI: "true"
        run: cargo tauri build --target aarch64-apple-darwin --bundles app
      - name: Build Intel macOS bundle
        if: steps.head_check.outputs.skip != 'true'
        env:
          CI: "true"
        run: cargo tauri build --target x86_64-apple-darwin --bundles app
      - name: Package release assets
        if: steps.head_check.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          assets_dir="$RUNNER_TEMP/release-assets"
          mkdir -p "$assets_dir"
          bash scripts/package-release.sh "$assets_dir/minilearn.zip" "$GITHUB_SHA"
          package_arch() {
            local target="$1" suffix="$2"
            local app="src-tauri/target/$target/release/bundle/macos/minilearn.app"
            local dmg="$assets_dir/minilearn-mac-$suffix.dmg"
            if bash scripts/create-dmg.sh "$app" "$dmg"; then
              return 0
            fi
            # Still ship something openable if the image never succeeds.
            echo "::warning::Could not create the $suffix .dmg; packaging the app bundle as a zip instead."
            ditto -c -k --sequesterRsrc --keepParent "$app" "$assets_dir/minilearn-mac-$suffix.zip"
          }
          package_arch aarch64-apple-darwin apple-silicon
          package_arch x86_64-apple-darwin intel
          ls -lh "$assets_dir"
      - name: Publish the latest tested main build
        if: steps.head_check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          head=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')
          if [[ "$head" != "$GITHUB_SHA" ]]; then
            echo "A newer commit is on main; skipping this older build."
            exit 0
          fi
          tag="build-$GITHUB_SHA"
          assets_dir="$RUNNER_TEMP/release-assets"
          # Publish whatever was packaged: both .dmg images, or a zipped .app
          # for an architecture whose disk image could not be created.
          assets=()
          while IFS= read -r path; do
            assets+=("$path")
          done < <(find "$assets_dir" -maxdepth 1 -type f | sort)
          if [[ ${#assets[@]} -eq 0 ]]; then
            echo "No release assets were packaged." >&2
            exit 1
          fi
          notes="Tested main build. Download the Mac .dmg for Apple Silicon or Intel, or minilearn.zip to run from source. Commit: $GITHUB_SHA."
          if gh release view "$tag" >/dev/null 2>&1; then
            # A retry can finish a draft or missing upload without replacing
            # the contents of a previously published release.
            existing=$(gh release view "$tag" --json assets --jq '.assets[].name')
            for path in "${assets[@]}"; do
              name=$(basename "$path")
              if ! printf '%s\n' "$existing" | grep -Fxq "$name"; then
                gh release upload "$tag" "$path"
              fi
            done
            if [[ "$(gh release view "$tag" --json isDraft --jq '.isDraft')" == true ]]; then
              gh release edit "$tag" --draft=false --latest
            fi
          else
            gh release create "$tag" "${assets[@]}" \
              --target "$GITHUB_SHA" \
              --title "minilearn (${GITHUB_SHA:0:7})" \
              --notes "$notes" \
              --latest
          fi
